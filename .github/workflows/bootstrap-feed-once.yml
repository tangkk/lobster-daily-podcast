name: Bootstrap Podcast Feed Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-feed-once.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install artwork dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip pillow
      - name: Generate valid cover and copy exact spoken texts
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import urllib.request, re

          size=1400
          im=Image.new('RGB',(size,size),(250,246,236))
          d=ImageDraw.Draw(im)
          navy=(18,42,62); red=(226,68,42); muted=(98,109,116); white=(255,253,247)
          zh=ImageFont.truetype('/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc',165)
          sub=ImageFont.truetype('/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',48)
          d.ellipse((430,180,970,720),fill=red)
          d.ellipse((520,600,880,1050),fill=red)
          d.arc((385,130,1015,760),180,360,fill=navy,width=38)
          d.rounded_rectangle((390,350,470,650),radius=28,fill=navy)
          d.rounded_rectangle((930,350,1010,650),radius=28,fill=navy)
          d.ellipse((535,360,625,450),fill=white); d.ellipse((775,360,865,450),fill=white)
          d.ellipse((570,395,600,425),fill=navy); d.ellipse((800,395,830,425),fill=navy)
          title='龙虾日报'; box=d.textbbox((0,0),title,font=zh); d.text(((size-(box[2]-box[0]))/2,1060),title,font=zh,fill=navy)
          tagline='AI、市场、中国与世界，每日重要信息简报'; box=d.textbbox((0,0),tagline,font=sub); d.text(((size-(box[2]-box[0]))/2,1260),tagline,font=sub,fill=muted)
          im.save('cover.jpg','JPEG',quality=92,optimize=True,progressive=True)
          assert Path('cover.jpg').stat().st_size > 20000

          def spoken_body(date):
              url=f'https://raw.githubusercontent.com/tangkk/daily_brief/main/spoken/{date}.md'
              text=urllib.request.urlopen(url,timeout=30).read().decode('utf-8')
              return re.sub(r'^---\n.*?\n---\n','',text,flags=re.S).strip()
          Path('episodes').mkdir(exist_ok=True)
          for n,date in [(6,'2026-08-26'),(7,'2026-08-27'),(8,'2026-08-28')]:
              body=spoken_body(date)
              assert len(body)>2000
              Path(f'episodes/ep{n:03d}-daily-{date}.txt').write_text(body+'\n',encoding='utf-8')
          print('cover bytes',Path('cover.jpg').stat().st_size)
          PY
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/bootstrap-feed-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cover.jpg episodes/
          git commit -m 'Finalize Lobster Daily cover and canonical episode texts [skip ci]'
          git push
