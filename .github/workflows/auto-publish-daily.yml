name: Auto Publish Daily

on:
  push:
    branches: [main]
    paths:
      - 'episodes/ep*-daily-*.txt'
  workflow_dispatch:
    inputs:
      text_file:
        description: Canonical spoken script, e.g. episodes/ep010-daily-2026-08-30.txt
        required: true

permissions:
  contents: write

concurrency:
  group: podcast-feed-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XFYUN_APPID: ${{ secrets.XFYUN_APPID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

    steps:
      - name: Checkout podcast repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --upgrade pip
          python -m pip install websocket-client boto3

      - name: Resolve canonical episode
        id: episode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TEXT_FILE="${{ inputs.text_file }}"
          else
            mapfile -t FILES < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^episodes/ep[0-9]+-daily-[0-9]{4}-[0-9]{2}-[0-9]{2}\.txt$' || true)
            test "${#FILES[@]}" -eq 1 || { echo "Expected exactly one changed Daily script, found ${#FILES[@]}"; exit 1; }
            TEXT_FILE="${FILES[0]}"
          fi
          test -f "$TEXT_FILE"
          STEM=$(basename "$TEXT_FILE" .txt)
          if [[ ! "$STEM" =~ ^ep([0-9]+)-daily-([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then echo "Unexpected Daily filename: $TEXT_FILE"; exit 1; fi
          DATE="${BASH_REMATCH[2]}"
          TITLE="龙虾日报｜${DATE:0:4}年${DATE:5:2}月${DATE:8:2}日"
          echo "text_file=$TEXT_FILE" >> "$GITHUB_OUTPUT"
          echo "slug=$STEM" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        run: |
          set -euo pipefail
          for v in XFYUN_APPID XFYUN_API_KEY XFYUN_API_SECRET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_URL; do test -n "${!v}" || { echo "Missing $v"; exit 1; }; done

      - name: Filter sensitive spoken content
        id: safe
        run: |
          set -euo pipefail
          mkdir -p build
          python scripts/check_sensitive_terms.py "${{ steps.episode.outputs.text_file }}" --filter-output build/safe-spoken.txt
          python scripts/check_sensitive_terms.py build/safe-spoken.txt
          DESCRIPTION=$(python - <<'PY'
          import pathlib, re
          text=pathlib.Path('build/safe-spoken.txt').read_text(encoding='utf-8').strip()
          first=re.split(r'\n\s*\n',text,maxsplit=1)[0].strip()
          first=re.sub(r'^今天最重要的一句话是[：:]\s*','',first)
          print(first[:220])
          PY
          )
          echo "description<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DESCRIPTION" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Prepare and validate spoken transcript
        run: |
          set -euo pipefail
          python scripts/prepare_tts_text.py build/safe-spoken.txt -o build/tts-transcript.txt
          test -s build/tts-transcript.txt
          python scripts/check_sensitive_terms.py build/tts-transcript.txt
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('prep', 'scripts/prepare_tts_text.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          sample = '2026年9月5日，8点30分，通胀4.1%，SBU 与 Micron。'
          out = m.prepare(sample, m.load_dict(Path('scripts/pronunciation.json')))
          expected = ['二零二六年九月五日', '八点三十分', '百分之四点一', '艾斯比优', '美光']
          missing = [x for x in expected if x not in out]
          assert not missing, f'TTS normalization smoke test failed, missing: {missing}; output={out!r}'
          print('TTS normalization smoke test:', out.strip())
          PY
          echo 'Prepared transcript preview:'
          sed -n '1,8p' build/tts-transcript.txt

      - name: Generate final TTS
        run: |
          set -euo pipefail
          test -s build/tts-transcript.txt
          python scripts/xfyun-tools/xfyun_segmented_run.py --text-file build/tts-transcript.txt --out "build/${{ steps.episode.outputs.slug }}.mp3" --profile default --pause-ms 350

      - name: Read final audio metadata
        id: audio
        run: |
          set -euo pipefail
          AUDIO="build/${{ steps.episode.outputs.slug }}.mp3"; test -s "$AUDIO"
          BYTES=$(stat -c %s "$AUDIO"); S=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$AUDIO")
          python -c 'import sys; s=float(sys.argv[1]); assert s>=30,f"invalid audio duration: {s}"' "$S"
          D=$(python -c 'import sys; s=round(float(sys.argv[1])); print(f"{s//3600:02d}:{(s%3600)//60:02d}:{s%60:02d}")' "$S")
          test "$D" != "00:00:00"
          echo "path=$AUDIO" >> "$GITHUB_OUTPUT"; echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"; echo "duration=$D" >> "$GITHUB_OUTPUT"

      - name: Refresh Podcast RSS from latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:feed.xml > feed.xml

      - name: Upload canonical MP3 and upsert Podcast RSS
        id: podcast
        run: |
          set -euo pipefail
          URL=$(python scripts/publish_episode.py --audio "${{ steps.audio.outputs.path }}" --slug "${{ steps.episode.outputs.slug }}" --title "${{ steps.episode.outputs.title }}" --description "${{ steps.safe.outputs.description }}" --duration "${{ steps.audio.outputs.duration }}" --prefix daily | tail -n 1)
          test -n "$URL"; echo "enclosure_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify local Podcast RSS
        env:
          SLUG: ${{ steps.episode.outputs.slug }}
          EXPECTED_URL: ${{ steps.podcast.outputs.enclosure_url }}
          EXPECTED_BYTES: ${{ steps.audio.outputs.bytes }}
          EXPECTED_DURATION: ${{ steps.audio.outputs.duration }}
        run: |
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          ns={'i':'http://www.itunes.com/dtds/podcast-1.0.dtd'}
          ch=ET.parse('feed.xml').getroot().find('channel'); xs=[i for i in ch.findall('item') if i.findtext('guid')==os.environ['SLUG']]
          assert len(xs)==1; i=xs[0]; e=i.find('enclosure')
          assert e.attrib['url']==os.environ['EXPECTED_URL']; assert int(e.attrib['length'])==int(os.environ['EXPECTED_BYTES']); assert i.findtext('i:duration',namespaces=ns)==os.environ['EXPECTED_DURATION']; assert i.findtext('i:episodeType',namespaces=ns)=='full'
          PY

      - name: Commit canonical Podcast RSS
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add feed.xml
          if ! git diff --cached --quiet; then git commit -m "Publish ${{ steps.episode.outputs.slug }} [skip ci]"; git push origin HEAD:main; fi

      - name: Verify public MP3 and live Podcast RSS
        env:
          SLUG: ${{ steps.episode.outputs.slug }}
          URL: ${{ steps.podcast.outputs.enclosure_url }}
          BYTES: ${{ steps.audio.outputs.bytes }}
          DURATION: ${{ steps.audio.outputs.duration }}
        run: python scripts/verify_public_release.py --repo "$GITHUB_REPOSITORY" --slug "$SLUG" --url "$URL" --bytes "$BYTES" --duration "$DURATION"
