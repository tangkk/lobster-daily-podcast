name: Replace Approved Episode Audio
on:
  push:
    branches: [main]
    paths: ['publish/requests/replace-*.json']
permissions: {contents: write, actions: read}
concurrency: {group: publish-daily, cancel-in-progress: false}
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: |
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python -m pip install --upgrade pip boto3
      - id: req
        run: |
          REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^publish/requests/replace-.+\.json$' | head -n 1); test -n "$REQUEST"
          python -m json.tool "$REQUEST" >/dev/null; test "$(jq -r '.operation' "$REQUEST")" = replace_audio
          for key in run_id artifact_name audio_filename audio_sha256 slug prefix; do value=$(jq -r --arg k "$key" '.[$k] // empty' "$REQUEST"); test -n "$value"; echo "$key=$value" >> "$GITHUB_OUTPUT"; done
      - uses: actions/download-artifact@v4
        with: {name: "${{ steps.req.outputs.artifact_name }}", path: approved, repository: "${{ github.repository }}", run-id: "${{ steps.req.outputs.run_id }}", github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        env: {FILE: "${{ steps.req.outputs.audio_filename }}", EXPECTED_SHA: "${{ steps.req.outputs.audio_sha256 }}"}
        run: |
          AUDIO="approved/$FILE"; test -s "$AUDIO"; test "$(sha256sum "$AUDIO" | awk '{print $1}')" = "$EXPECTED_SHA"; AUDIO_BYTES=$(stat -c %s "$AUDIO"); AUDIO_SECONDS=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$AUDIO"); DURATION=$(python -c 'import sys; s=round(float(sys.argv[1])); print(f"{s//3600:02d}:{(s%3600)//60:02d}:{s%60:02d}")' "$AUDIO_SECONDS"); echo "audio=$AUDIO" >> "$GITHUB_OUTPUT"; echo "bytes=$AUDIO_BYTES" >> "$GITHUB_OUTPUT"; echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
      - env: {SLUG: "${{ steps.req.outputs.slug }}", PREFIX: "${{ steps.req.outputs.prefix }}", AUDIO: "${{ steps.meta.outputs.audio }}", AUDIO_BYTES: "${{ steps.meta.outputs.bytes }}", DURATION: "${{ steps.meta.outputs.duration }}"}
        run: mkdir -p build && python scripts/replace_episode_audio.py prepare --audio "$AUDIO" --slug "$SLUG" --prefix "$PREFIX" --bytes "$AUDIO_BYTES" --duration "$DURATION" --state build/replacement-backup.txt
      - env: {SLUG: "${{ steps.req.outputs.slug }}"}
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add feed.xml; git commit -m "Replace audio for ${SLUG} from approved artifact [skip ci]"; git push
