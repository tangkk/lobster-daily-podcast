name: TTS Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'episodes/**'
      - '.github/workflows/tts-preview.yml'
      - 'scripts/xfyun-tools/**'
  workflow_dispatch:
    inputs:
      text_file:
        description: Canonical text file to synthesize
        required: true
      output_name:
        description: Output mp3 filename; leave blank to derive from canonical filename
        required: false

concurrency:
  group: tts-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XFYUN_APPID: ${{ secrets.XFYUN_APPID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --upgrade pip
          python -m pip install websocket-client
      - name: Resolve build inputs
        id: inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TEXT_FILE="${{ inputs.text_file }}"
            OUTPUT_NAME="${{ inputs.output_name }}"
          else
            mapfile -t EPISODES < <(git diff --name-only HEAD^1 HEAD -- 'episodes/*.txt')
            test "${#EPISODES[@]}" -eq 1 || { echo "Expected exactly one changed canonical episode, found ${#EPISODES[@]}"; exit 1; }
            TEXT_FILE="${EPISODES[0]}"
            OUTPUT_NAME=""
          fi
          if [ -z "$OUTPUT_NAME" ]; then STEM=$(basename "$TEXT_FILE" .txt); OUTPUT_NAME="${STEM}-preview.mp3"; fi
          echo "text_file=$TEXT_FILE" >> "$GITHUB_OUTPUT"
          echo "output_name=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
      - name: Validate build-only inputs
        shell: bash
        run: |
          test -n "$XFYUN_APPID"
          test -n "$XFYUN_API_KEY"
          test -n "$XFYUN_API_SECRET"
          test -f "${{ steps.inputs.outputs.text_file }}"
          mkdir -p build
      - name: Generate segmented TTS preview
        run: |
          python scripts/xfyun-tools/xfyun_segmented_run.py \
            --text-file "${{ steps.inputs.outputs.text_file }}" \
            --out "build/${{ steps.inputs.outputs.output_name }}" \
            --profile default \
            --pause-ms 350
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-preview-${{ github.sha }}
          path: build/${{ steps.inputs.outputs.output_name }}
          if-no-files-found: error
          retention-days: 7
