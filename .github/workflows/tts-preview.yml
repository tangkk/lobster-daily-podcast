name: TTS Preview

on:
  workflow_dispatch:
    inputs:
      text_file:
        description: Canonical text file to synthesize
        required: true
      output_name:
        description: Output mp3 filename; leave blank to derive from canonical filename
        required: false

concurrency:
  group: tts-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XFYUN_APPID: ${{ secrets.XFYUN_APPID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --upgrade pip
          python -m pip install websocket-client
      - name: Resolve build inputs
        id: inputs
        shell: bash
        run: |
          TEXT_FILE="${{ inputs.text_file }}"
          OUTPUT_NAME="${{ inputs.output_name }}"
          test -f "$TEXT_FILE"
          if [ -z "$OUTPUT_NAME" ]; then
            STEM=$(basename "$TEXT_FILE" .txt)
            OUTPUT_NAME="${STEM}-preview.mp3"
          fi
          echo "text_file=$TEXT_FILE" >> "$GITHUB_OUTPUT"
          echo "output_name=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
      - name: Validate build-only inputs
        shell: bash
        run: |
          test -n "$XFYUN_APPID"
          test -n "$XFYUN_API_KEY"
          test -n "$XFYUN_API_SECRET"
          mkdir -p build
      - name: Filter sensitive spoken content
        run: |
          set -euo pipefail
          python scripts/check_sensitive_terms.py "${{ steps.inputs.outputs.text_file }}" --filter-output build/safe-spoken.txt
          python scripts/check_sensitive_terms.py build/safe-spoken.txt
      - name: Prepare and validate spoken transcript
        run: |
          set -euo pipefail
          python scripts/prepare_tts_text.py build/safe-spoken.txt -o build/tts-transcript.txt
          test -s build/tts-transcript.txt
          python scripts/check_sensitive_terms.py build/tts-transcript.txt
          echo 'Prepared transcript preview:'
          sed -n '1,8p' build/tts-transcript.txt
      - name: Generate segmented TTS preview
        run: |
          python scripts/xfyun-tools/xfyun_segmented_run.py \
            --text-file build/tts-transcript.txt \
            --out "build/${{ steps.inputs.outputs.output_name }}" \
            --profile default \
            --pause-ms 350
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-preview-${{ github.sha }}
          path: build/${{ steps.inputs.outputs.output_name }}
          if-no-files-found: error
          retention-days: 7
