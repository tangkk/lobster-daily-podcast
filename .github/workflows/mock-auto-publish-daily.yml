name: Mock Auto Publish Daily

on:
  push:
    branches: [main]
    paths:
      - 'mock/requests/mock-daily-*.json'
  workflow_dispatch:
    inputs:
      date:
        description: Asia/Shanghai date, YYYY-MM-DD
        required: true
      text_file:
        description: Existing canonical spoken script to mirror
        required: true

permissions:
  contents: read

concurrency:
  group: mock-daily-release
  cancel-in-progress: false

jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XFYUN_APPID: ${{ secrets.XFYUN_APPID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
    steps:
      - name: Checkout podcast repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --upgrade pip websocket-client

      - name: Resolve mock input
        id: input
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DATE="${{ inputs.date }}"
            TEXT_FILE="${{ inputs.text_file }}"
          else
            REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^mock/requests/mock-daily-.+\.json$' | head -n 1)
            test -n "$REQUEST"
            python -m json.tool "$REQUEST" >/dev/null
            DATE=$(jq -r '.date // empty' "$REQUEST")
            TEXT_FILE=$(jq -r '.text_file // empty' "$REQUEST")
          fi
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test -f "$TEXT_FILE"
          STEM=$(basename "$TEXT_FILE" .txt)
          [[ "$STEM" =~ ^ep[0-9]+-daily-${DATE}$ ]] || { echo "Source/date mismatch: $TEXT_FILE / $DATE"; exit 1; }
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "text_file=$TEXT_FILE" >> "$GITHUB_OUTPUT"
          echo "slug=$STEM" >> "$GITHUB_OUTPUT"

      - name: Assert mock isolation
        run: |
          set -euo pipefail
          for v in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_URL; do
            test -z "${!v:-}" || { echo "Mock must not receive production R2 secret: $v"; exit 1; }
          done
          echo 'Isolation OK: no production R2 credentials are exposed to this job.'

      - name: Filter sensitive spoken content
        run: |
          set -euo pipefail
          mkdir -p build
          python scripts/check_sensitive_terms.py "${{ steps.input.outputs.text_file }}" --filter-output build/safe-spoken.txt
          python scripts/check_sensitive_terms.py build/safe-spoken.txt

      - name: Prepare and validate spoken transcript
        run: |
          set -euo pipefail
          python scripts/prepare_tts_text.py build/safe-spoken.txt -o build/tts-transcript.txt
          test -s build/tts-transcript.txt
          python scripts/check_sensitive_terms.py build/tts-transcript.txt

      - name: Generate mock TTS with production engine
        run: |
          set -euo pipefail
          for v in XFYUN_APPID XFYUN_API_KEY XFYUN_API_SECRET; do test -n "${!v}"; done
          python scripts/xfyun-tools/xfyun_segmented_run.py \
            --text-file build/tts-transcript.txt \
            --out "build/${{ steps.input.outputs.slug }}-mock.mp3" \
            --profile default --pause-ms 350

      - name: Read mock audio metadata
        id: audio
        run: |
          set -euo pipefail
          AUDIO="build/${{ steps.input.outputs.slug }}-mock.mp3"
          test -s "$AUDIO"
          BYTES=$(stat -c %s "$AUDIO")
          S=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$AUDIO")
          python -c 'import sys; s=float(sys.argv[1]); assert s>=30' "$S"
          D=$(python -c 'import sys; s=round(float(sys.argv[1])); print(f"{s//3600:02d}:{(s%3600)//60:02d}:{s%60:02d}")' "$S")
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "duration=$D" >> "$GITHUB_OUTPUT"

      - name: Simulate production RSS upsert locally
        env:
          DATE: ${{ steps.input.outputs.date }}
          SLUG: ${{ steps.input.outputs.slug }}
          BYTES: ${{ steps.audio.outputs.bytes }}
          DURATION: ${{ steps.audio.outputs.duration }}
        run: |
          set -euo pipefail
          cp feed.xml build/mock-feed.xml
          python - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          from email.utils import format_datetime
          import datetime as dt
          ITUNES='http://www.itunes.com/dtds/podcast-1.0.dtd'
          ATOM='http://www.w3.org/2005/Atom'
          ET.register_namespace('itunes',ITUNES); ET.register_namespace('atom',ATOM)
          path='build/mock-feed.xml'; tree=ET.parse(path); ch=tree.getroot().find('channel')
          slug=os.environ['SLUG']; date=os.environ['DATE']; size=os.environ['BYTES']; duration=os.environ['DURATION']
          items=[i for i in ch.findall('item') if i.findtext('guid')==slug]
          assert len(items)<=1, f'duplicate production GUID before mock: {slug}'
          if items: item=items[0]
          else:
            item=ET.Element('item'); first=ch.find('item'); ch.insert(list(ch).index(first) if first is not None else len(ch),item)
            ET.SubElement(item,'pubDate').text=format_datetime(dt.datetime.now(dt.timezone.utc))
          def set_text(tag,text,attrs=None):
            node=item.find(tag)
            if node is None: node=ET.SubElement(item,tag)
            if attrs is not None: node.attrib.clear(); node.attrib.update(attrs)
            node.text=text
          set_text('title',f'龙虾日报｜{date[:4]}年{date[5:7]}月{date[8:10]}日')
          safe=open('build/safe-spoken.txt',encoding='utf-8').read().strip()
          desc=re.split(r'\n\s*\n',safe,maxsplit=1)[0].strip()
          desc=re.sub(r'^今天最重要的一句话是[：:]\s*','',desc)[:220]
          set_text('description',desc); set_text('guid',slug,{'isPermaLink':'false'})
          url=f'https://mock.invalid/daily/{slug}.mp3'
          set_text('enclosure',None,{'url':url,'length':size,'type':'audio/mpeg'})
          set_text(f'{{{ITUNES}}}duration',duration); set_text(f'{{{ITUNES}}}episodeType','full'); set_text(f'{{{ITUNES}}}explicit','false')
          matches=[i for i in ch.findall('item') if i.findtext('guid')==slug]; assert len(matches)==1
          tree.write(path,encoding='utf-8',xml_declaration=True)
          print(url)
          PY

      - name: Mirror written-site handoff check
        env:
          DATE: ${{ steps.input.outputs.date }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/tangkk/daily_brief.git build/daily-brief-repo
          test -f "build/daily-brief-repo/_drafts/${DATE}-daily-brief.md" || test -f "build/daily-brief-repo/_posts/${DATE}-daily-brief.md"
          python build/daily-brief-repo/scripts/publish_staged_daily.py \
            --date "$DATE" --feed "$GITHUB_WORKSPACE/build/mock-feed.xml" --check-only \
            > build/written-handoff.json
          cat build/written-handoff.json

      - name: Build release plan and validation report
        env:
          DATE: ${{ steps.input.outputs.date }}
          SLUG: ${{ steps.input.outputs.slug }}
          BYTES: ${{ steps.audio.outputs.bytes }}
          DURATION: ${{ steps.audio.outputs.duration }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          slug=os.environ['SLUG']; date=os.environ['DATE']
          ch=ET.parse('build/mock-feed.xml').getroot().find('channel')
          item=[i for i in ch.findall('item') if i.findtext('guid')==slug][0]
          e=item.find('enclosure')
          plan={
            'mode':'MOCK_ONLY',
            'date':date,
            'slug':slug,
            'guid':item.findtext('guid'),
            'would_generate_tts':True,
            'would_backup_existing_production_audio_before_overwrite':True,
            'would_write_r2':False,
            'would_write_feed':False,
            'would_push_main':False,
            'would_deploy_pages':False,
            'would_send_production_notification':False,
            'simulated_enclosure_url':e.attrib['url'],
            'bytes':int(e.attrib['length']),
            'duration':item.findtext('{http://www.itunes.com/dtds/podcast-1.0.dtd}duration'),
            'written_handoff':json.loads(pathlib.Path('build/written-handoff.json').read_text()),
            'result':'PASS'
          }
          pathlib.Path('build/release-plan.json').write_text(json.dumps(plan,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pathlib.Path('build/validation-report.txt').write_text(
            'MOCK PASS\n'
            'Production side effects: NONE\n'
            'Spoken safety: PASS\nTTS normalization: PASS\nProduction TTS engine: PASS\n'
            'RSS upsert simulation: PASS\nWritten-site handoff check: PASS\n',encoding='utf-8')
          print(json.dumps(plan,ensure_ascii=False,indent=2))
          PY

      - name: Prove repository remained untouched
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'Tracked repository state unchanged.'

      - name: Upload mock release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mock-daily-${{ steps.input.outputs.date }}-${{ github.run_id }}
          path: |
            build/safe-spoken.txt
            build/tts-transcript.txt
            build/*-mock.mp3
            build/mock-feed.xml
            build/written-handoff.json
            build/release-plan.json
            build/validation-report.txt
          retention-days: 7
