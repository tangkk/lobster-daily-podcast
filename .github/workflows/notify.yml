name: Notify Workflow Completion

on:
  workflow_run:
    workflows:
      - Auto Publish Daily
      - Publish Approved Artifact
      - Replace Approved Episode Audio
      - TTS Preview
      - pages build and deployment
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        env:
          NOTIFY_URL: https://notify.tangkk-x2o.com/github-workflows
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          STATUS: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          test -n "$NTFY_TOKEN" || { echo 'Missing NTFY_TOKEN secret'; exit 1; }
          if [ "$STATUS" = "success" ]; then
            TAGS="white_check_mark"
            LABEL="SUCCESS"
          else
            TAGS="x"
            LABEL="${STATUS^^}"
          fi
          curl --fail-with-body --retry 3 --max-time 15 \
            -H "Authorization: Bearer ${NTFY_TOKEN}" \
            -H "Title: ${REPO} · ${WORKFLOW}" \
            -H "Tags: ${TAGS}" \
            -H "Click: ${RUN_URL}" \
            -d "${LABEL} · ${BRANCH} · @${ACTOR}" \
            "$NOTIFY_URL"
