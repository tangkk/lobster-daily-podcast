name: Publish Approved Artifact
on:
  push:
    branches: [main]
    paths:
      - 'publish/requests/**.json'
      - '!publish/requests/replace-*.json'
permissions: {contents: write, actions: read}
concurrency: {group: publish-daily, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python -m pip install --upgrade pip
          python -m pip install boto3
      - name: Resolve publish request
        id: req
        run: |
          REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^publish/requests/.*\.json$' | grep -v '^publish/requests/replace-' | head -n 1)
          test -n "$REQUEST" || { echo 'No new-episode publish request'; exit 1; }
          python -m json.tool "$REQUEST" >/dev/null
          for key in run_id artifact_name audio_filename audio_sha256 slug title description article_url prefix; do value=$(jq -r --arg k "$key" '.[$k] // empty' "$REQUEST"); test -n "$value" || { echo "Missing $key"; exit 1; }; echo "$key<<EOF" >> "$GITHUB_OUTPUT"; echo "$value" >> "$GITHUB_OUTPUT"; echo EOF >> "$GITHUB_OUTPUT"; done
      - name: Validate pre-publish state
        env: {SLUG: "${{ steps.req.outputs.slug }}"}
        run: |
          for v in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_URL; do test -n "${!v}" || { echo "Missing $v"; exit 1; }; done
          ! grep -q "<guid[^>]*>${SLUG}</guid>" feed.xml || { echo "GUID already exists: $SLUG"; exit 1; }
          NEXT=$(python -c 'import re,pathlib; s=pathlib.Path("feed.xml").read_text(); n=[int(x) for x in re.findall(r"<guid[^>]*>ep(\d+)-",s)]; print(max(n)+1 if n else 1)')
          REQ=$(python -c 'import re,sys; m=re.match(r"ep(\d+)-",sys.argv[1]); print(int(m.group(1)) if m else -1)' "$SLUG")
          test "$REQ" = "$NEXT" || { echo "Episode number mismatch: expected $NEXT got $REQ"; exit 1; }
      - name: Download exact approved artifact
        uses: actions/download-artifact@v4
        with: {name: "${{ steps.req.outputs.artifact_name }}", path: approved, repository: "${{ github.repository }}", run-id: "${{ steps.req.outputs.run_id }}", github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Validate exact approved audio
        id: meta
        env: {FILE: "${{ steps.req.outputs.audio_filename }}", EXPECTED_SHA: "${{ steps.req.outputs.audio_sha256 }}"}
        run: |
          AUDIO="approved/$FILE"; test -s "$AUDIO" || exit 1; test "$(sha256sum "$AUDIO" | awk '{print $1}')" = "$EXPECTED_SHA" || { echo 'SHA256 mismatch'; exit 1; }
          AUDIO_BYTES=$(stat -c %s "$AUDIO"); AUDIO_SECONDS=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$AUDIO"); DURATION=$(python -c 'import sys; s=round(float(sys.argv[1])); print(f"{s//3600:02d}:{(s%3600)//60:02d}:{s%60:02d}")' "$AUDIO_SECONDS")
          echo "audio=$AUDIO" >> "$GITHUB_OUTPUT"; echo "bytes=$AUDIO_BYTES" >> "$GITHUB_OUTPUT"; echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
      - name: Upload approved audio and update feed
        env: {SLUG: "${{ steps.req.outputs.slug }}", TITLE: "${{ steps.req.outputs.title }}", DESCRIPTION: "${{ steps.req.outputs.description }}", PREFIX: "${{ steps.req.outputs.prefix }}", AUDIO: "${{ steps.meta.outputs.audio }}", DURATION: "${{ steps.meta.outputs.duration }}"}
        run: python scripts/publish_episode.py --audio "$AUDIO" --slug "$SLUG" --title "$TITLE" --description "$DESCRIPTION" --duration "$DURATION" --prefix "$PREFIX"
      - name: Verify and commit
        env: {SLUG: "${{ steps.req.outputs.slug }}", EXPECTED_BYTES: "${{ steps.meta.outputs.bytes }}", EXPECTED_DURATION: "${{ steps.meta.outputs.duration }}"}
        run: |
          python -c 'import os,xml.etree.ElementTree as ET; ch=ET.parse("feed.xml").getroot().find("channel"); i=ch.find("item"); ns={"itunes":"http://www.itunes.com/dtds/podcast-1.0.dtd"}; assert i.findtext("guid")==os.environ["SLUG"]; assert i.findtext("itunes:duration",namespaces=ns)==os.environ["EXPECTED_DURATION"]; assert int(i.find("enclosure").attrib["length"])==int(os.environ["EXPECTED_BYTES"])'
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add feed.xml; git commit -m "Publish ${SLUG} from approved artifact [skip ci]"; git push
