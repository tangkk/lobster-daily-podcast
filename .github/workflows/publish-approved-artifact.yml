name: Publish Approved Artifact
on:
  push:
    branches: [main]
    paths:
      - 'publish/requests/**.json'
      - '!publish/requests/replace-*.json'
permissions: {contents: write, actions: read}
concurrency: {group: podcast-feed-write, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python -m pip install --upgrade pip
          python -m pip install boto3
      - name: Resolve publish request
        id: req
        run: |
          REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^publish/requests/.*\.json$' | grep -v '^publish/requests/replace-' | head -n 1); test -n "$REQUEST" || exit 1
          python -m json.tool "$REQUEST" >/dev/null
          for key in run_id artifact_name audio_filename audio_sha256 slug title description article_url prefix; do value=$(jq -r --arg k "$key" '.[$k] // empty' "$REQUEST"); test -n "$value" || exit 1; echo "$key<<EOF" >> "$GITHUB_OUTPUT"; echo "$value" >> "$GITHUB_OUTPUT"; echo EOF >> "$GITHUB_OUTPUT"; done
      - name: Refresh feed from latest main
        run: git fetch origin main && git show origin/main:feed.xml > feed.xml
      - name: Validate pre-publish state
        env: {SLUG: "${{ steps.req.outputs.slug }}"}
        run: |
          for v in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_URL; do test -n "${!v}" || exit 1; done
          if grep -q "<guid[^>]*>${SLUG}</guid>" feed.xml; then echo 'Idempotent rerun'; else NEXT=$(python -c 'import re,pathlib; s=pathlib.Path("feed.xml").read_text(); n=[int(x) for x in re.findall(r"<guid[^>]*>ep(\d+)-",s)]; print(max(n)+1 if n else 1)'); REQ=$(python -c 'import re,sys; m=re.match(r"ep(\d+)-",sys.argv[1]); print(int(m.group(1)) if m else -1)' "$SLUG"); test "$REQ" = "$NEXT"; fi
      - uses: actions/download-artifact@v4
        with: {name: "${{ steps.req.outputs.artifact_name }}", path: approved, repository: "${{ github.repository }}", run-id: "${{ steps.req.outputs.run_id }}", github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Validate exact approved audio
        id: meta
        env: {FILE: "${{ steps.req.outputs.audio_filename }}", EXPECTED_SHA: "${{ steps.req.outputs.audio_sha256 }}"}
        run: |
          AUDIO="approved/$FILE"; test -s "$AUDIO"; test "$(sha256sum "$AUDIO"|awk '{print $1}')" = "$EXPECTED_SHA"
          B=$(stat -c %s "$AUDIO"); S=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$AUDIO"); python -c 'import sys; assert float(sys.argv[1])>1' "$S"; D=$(python -c 'import sys; s=round(float(sys.argv[1])); print(f"{s//3600:02d}:{(s%3600)//60:02d}:{s%60:02d}")' "$S"); echo "audio=$AUDIO" >> "$GITHUB_OUTPUT"; echo "bytes=$B" >> "$GITHUB_OUTPUT"; echo "duration=$D" >> "$GITHUB_OUTPUT"
      - name: Upload canonical MP3 and upsert feed
        id: release
        env: {SLUG: "${{ steps.req.outputs.slug }}", TITLE: "${{ steps.req.outputs.title }}", DESCRIPTION: "${{ steps.req.outputs.description }}", PREFIX: "${{ steps.req.outputs.prefix }}", AUDIO: "${{ steps.meta.outputs.audio }}", DURATION: "${{ steps.meta.outputs.duration }}"}
        run: |
          URL=$(python scripts/publish_episode.py --audio "$AUDIO" --slug "$SLUG" --title "$TITLE" --description "$DESCRIPTION" --duration "$DURATION" --prefix "$PREFIX" | tail -n 1); test -n "$URL"; echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Commit canonical feed
        env: {SLUG: "${{ steps.req.outputs.slug }}"}
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add feed.xml
          if ! git diff --cached --quiet; then git commit -m "Publish ${SLUG} from approved artifact [skip ci]"; git push origin HEAD:main; fi
      - name: Verify public MP3 and live RSS
        env: {SLUG: "${{ steps.req.outputs.slug }}", URL: "${{ steps.release.outputs.url }}", BYTES: "${{ steps.meta.outputs.bytes }}", DURATION: "${{ steps.meta.outputs.duration }}"}
        run: python scripts/verify_public_release.py --repo "$GITHUB_REPOSITORY" --slug "$SLUG" --url "$URL" --bytes "$BYTES" --duration "$DURATION"
